name: Report CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.md'
      - 'assets/**'
      - '.github/workflows/report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-generate-report:
    name: Validate, Compile & Release Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Markdown Relative Links & Assets
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys

          failed = False
          md_files_found = 0

          print("🔍 Starting integrity validation for Markdown references...")

          for root, dirs, files in os.walk("."):
              # Skip hidden dirs like .git and virtual environments
              if any(part.startswith(".") and part != "." for part in root.split(os.sep)):
                  continue

              for file in files:
                  if file.endswith(".md"):
                      md_files_found += 1
                      md_path = os.path.join(root, file)
                      with open(md_path, "r", encoding="utf-8") as f:
                          content = f.read()

                      # Match Markdown links and images: [text](path) or ![alt](path)
                      md_links = re.findall(r'!?\[.*?\]\(([^)]+)\)', content)
                      # Match HTML img tags: <img ... src="path" ...>
                      html_imgs = re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', content, re.IGNORECASE)

                      all_refs = md_links + html_imgs
                      print(f"\n📄 Checking {md_path} ({len(all_refs)} references found)...")

                      for ref in all_refs:
                          cleaned_ref = ref.strip().split("#")[0].split("?")[0]
                          if not cleaned_ref:
                              continue
                          # Ignore external links and anchors
                          if cleaned_ref.startswith(("http://", "https://", "mailto:", "ftp://")):
                              continue

                          # Resolve relative path from the current markdown file's directory
                          resolved_path = os.path.normpath(os.path.join(root, cleaned_ref))
                          if not os.path.exists(resolved_path):
                              print(f"  ❌ Broken reference: '{ref}' -> Target not found at '{resolved_path}'")
                              failed = True
                          else:
                              print(f"  ✅ Verified: '{ref}'")

          if md_files_found == 0:
              print("⚠️ Warning: No Markdown files found to validate.")

          if failed:
              print("\n❌ Integrity check failed: One or more referenced files are missing.")
              sys.exit(1)

          print("\n✨ All Markdown assets and relative links verified successfully!")
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PDF Generation Tools
        run: |
          npm install -g md-to-pdf

      - name: Compile Report to PDF
        run: |
          mkdir -p dist
          npx md-to-pdf --launch-options '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' --pdf-options '{"format": "A4", "margin": {"top": "20mm", "bottom": "20mm", "left": "15mm", "right": "15mm"}, "printBackground": true}' --dest dist/SmartStay-Report.pdf README.md

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartstay-report-pdf
          path: dist/SmartStay-Report.pdf
          retention-days: 14

      - name: Create Automatic Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Automated Report Delivery
            - **Run Number:** `${{ github.run_number }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Deliverable:** `SmartStay-Report.pdf`
          files: dist/SmartStay-Report.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}